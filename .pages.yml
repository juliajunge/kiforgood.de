# Konfiguration für den Web-Editor „Pages CMS“ (https://pagescms.org)
# Damit lassen sich Termine, Wissenspool und Texte im Browser bearbeiten – ohne Git-Kenntnisse.

media:
  input: src/wp-content/uploads
  output: /wp-content/uploads

content:
  - name: termine
    label: Termine (Workshops)
    type: file
    path: inhalte/termine.md
    format: yaml-frontmatter
    fields:
      - name: body
        label: Termine – so geschrieben, wie sie auf der Website erscheinen
        description: Einfach einen vorhandenen Termin kopieren und anpassen. Zwischen zwei Terminen eine Leerzeile. Die Erklärung steht ganz oben in der Datei.
        type: code
        options:
          language: markdown

  - name: wissenspool
    label: Wissenspool
    type: file
    path: inhalte/wissenspool.md
    format: yaml-frontmatter
    fields:
      - name: body
        label: Wissenspool – so geschrieben, wie er auf der Website erscheint
        description: Einen vorhandenen Eintrag kopieren und anpassen. Zwischen zwei Einträgen eine Leerzeile. Neue Bilder unter „Media“ hochladen. Die Erklärung steht ganz oben in der Datei.
        type: code
        options:
          language: markdown

  - name: seiten
    label: Seiten (HTML – nur mit Vorsicht ändern)
    type: collection
    path: src/seiten
    extension: html
    view:
      fields: [title, permalink]
    fields:
      - { name: title, label: Seitentitel (Browser-Tab), type: string }
      - { name: description, label: Beschreibung für Suchmaschinen, type: text }
      - { name: permalink, label: Adresse (nicht ändern), type: string, readonly: true }
      - { name: bodyclass, label: Technisch (nicht ändern), type: string, hidden: true }
      - { name: css, label: Technisch (nicht ändern), type: string, hidden: true }
      - { name: body, label: Inhalt (HTML), type: code, options: { language: html } }
