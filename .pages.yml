# Konfiguration für den Web-Editor „Pages CMS“ (https://pagescms.org)
# Damit lassen sich Termine, Wissenspool und Texte im Browser bearbeiten – ohne Git-Kenntnisse.

media:
  input: src/wp-content/uploads
  output: /wp-content/uploads

content:
  - name: termine
    label: Termine (Workshops)
    type: file
    path: inhalte/termine.md
    format: yaml-frontmatter
    fields:
      - name: body
        label: Termine – so geschrieben, wie sie auf der Website erscheinen
        description: Einfach einen vorhandenen Termin kopieren und anpassen. Zwischen zwei Terminen eine Leerzeile. Die Erklärung steht ganz oben in der Datei.
        type: code
        options:
          language: markdown

  - name: wissenspool
    label: Wissenspool
    type: file
    path: src/_data/wissenspool.yaml
    format: yaml
    fields:
      - name: favoriten
        label: Unsere Favoriten (Kacheln oben)
        type: object
        list: true
        fields:
          - { name: bild, label: Bild, type: image, required: true }
          - { name: bild_alt, label: Bildbeschreibung (für Screenreader), type: string }
          - { name: text, label: Text auf dem Knopf, type: string, required: true }
          - { name: url, label: Link, type: string, required: true }
          - { name: bild_url, label: Link beim Klick aufs Bild (optional), type: string }
      - name: bereiche
        label: Bereiche
        type: object
        list: true
        fields:
          - { name: titel, label: Überschrift, type: string, required: true }
          - { name: bild, label: Bild unter dem Bereich (optional), type: image }
          - name: eintraege
            label: Einträge
            type: object
            list: true
            fields: &eintrag
              - { name: icon, label: "Symbol (z. B. 📋 🎓 🎬 🎧 ✉️)", type: string }
              - { name: titel, label: Linktext, type: string }
              - { name: url, label: Link, type: string }
              - { name: zusatz, label: "Zusatz nach dem Link (fett, Links als [Text](https://…))", type: string }
              - { name: text, label: "Beschreibung (Links als [Text](https://…))", type: text }
          - name: gruppen
            label: Unterüberschriften mit Einträgen (optional)
            type: object
            list: true
            fields:
              - { name: titel, label: Unterüberschrift, type: string }
              - { name: ebene, label: "Größe (3 = größer, 4 = kleiner)", type: number }
              - { name: eintraege, label: Einträge, type: object, list: true, fields: *eintrag }

  - name: seiten
    label: Seiten (HTML – nur mit Vorsicht ändern)
    type: collection
    path: src/seiten
    extension: html
    view:
      fields: [title, permalink]
    fields:
      - { name: title, label: Seitentitel (Browser-Tab), type: string }
      - { name: description, label: Beschreibung für Suchmaschinen, type: text }
      - { name: permalink, label: Adresse (nicht ändern), type: string, readonly: true }
      - { name: bodyclass, label: Technisch (nicht ändern), type: string, hidden: true }
      - { name: css, label: Technisch (nicht ändern), type: string, hidden: true }
      - { name: body, label: Inhalt (HTML), type: code, options: { language: html } }
