name: Wöchentliches Update (KI-Vorschlag)

# Claude recherchiert neue Termine und liest die Einreichungen aus dem Postfach.
# Ergebnis ist IMMER nur ein Änderungsvorschlag (Pull Request), den ein Mensch annehmen muss.
# Claude selbst hat keine Schreibrechte auf GitHub: Den Vorschlag erstellt erst der letzte Schritt,
# und der übernimmt ausschließlich Änderungen an inhalte/termine.md.

on:
  schedule:
    - cron: "0 5 * * 1" # montags gegen 7 Uhr
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ki-vorschlag
  cancel-in-progress: false

jobs:
  vorschlag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Kalenderwoche bestimmen
        id: kw
        run: echo "name=$(TZ=Europe/Berlin date +%G-KW%V)" >> "$GITHUB_OUTPUT"

      # Ist das Postfach nicht erreichbar, läuft das Update trotzdem; der Bericht nennt dann das Problem.
      - name: Einreichungen aus dem Postfach abholen
        id: postfach
        if: vars.POSTFACH_AKTIV == 'true'
        continue-on-error: true
        run: python3 scripts/postfach-abholen.py abholen
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_BENUTZER: ${{ secrets.IMAP_BENUTZER }}
          IMAP_PASSWORT: ${{ secrets.IMAP_PASSWORT }}
          ERLAUBTE_ABSENDER: ${{ secrets.ERLAUBTE_ABSENDER }}

      - name: Claude recherchiert und ergänzt die Terminliste
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Führe das wöchentliche Termine-Update für die Website KI for Good durch.
            Halte dich genau an .claude/skills/termine-recherche/SKILL.md und an CLAUDE.md.
            Einreichungen aus dem Postfach (falls vorhanden): eingang/einreichungen.md
            Ändere ausschließlich inhalte/termine.md. Schreibe am Ende IMMER einen Bericht nach eingang/bericht.md –
            auch wenn du nichts geändert hast (dann mit Begründung).
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Edit,Write,WebSearch,WebFetch,Bash(npm run pruefen)"
            --disallowedTools "Bash(git:*)"

      - name: Zusammenfassung des KI-Laufs anzeigen
        if: always()
        run: node scripts/lauf-zusammenfassung.mjs "${{ steps.claude.outputs.execution_file }}"

      - name: Schutzregeln und Daten prüfen
        run: |
          mkdir -p eingang
          test -s eingang/bericht.md || echo "Claude hat keinen Bericht geschrieben. Bitte die Änderungen unter „Files changed“ prüfen." > eingang/bericht.md
          if [ "${{ steps.postfach.outcome }}" = "failure" ]; then
            printf '\n## Postfach\n- ⚠️ Das Postfach konnte nicht gelesen werden. Einreichungen sind in diesem Vorschlag nicht enthalten. Details unter Actions im Schritt „Einreichungen aus dem Postfach abholen“.\n' >> eingang/bericht.md
          fi
          node scripts/vorschlag-pruefen.mjs HEAD
          npm run build

      - name: Vorschlag als Pull Request anlegen
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: aktualisierung/termine-${{ steps.kw.outputs.name }}
          add-paths: inhalte/termine.md
          commit-message: "Termine: Vorschlag ${{ steps.kw.outputs.name }}"
          title: "Termine-Update ${{ steps.kw.outputs.name }} (KI-Vorschlag)"
          body-path: eingang/bericht.md
          labels: ki-vorschlag
          delete-branch: true

      - name: Abgeholte Mails als erledigt markieren
        # Nur wenn wirklich ein Vorschlag entstanden ist (ohne Änderungen legt der vorige Schritt keinen an).
        if: steps.postfach.outcome == 'success' && steps.pr.outputs.pull-request-number != ''
        run: python3 scripts/postfach-abholen.py erledigt
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_BENUTZER: ${{ secrets.IMAP_BENUTZER }}
          IMAP_PASSWORT: ${{ secrets.IMAP_PASSWORT }}
