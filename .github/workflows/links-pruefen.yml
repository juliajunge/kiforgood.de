name: Monatliche Linkprüfung

# 1. Ein Linkchecker (lychee) prüft alle Links der gebauten Website.
# 2. Für kaputte Links im Wissenspool sucht Claude Ersatz und schlägt ihn als Pull Request vor.
# 3. Kaputte Links auf den übrigen Seiten werden im Bericht aufgeführt und von Hand korrigiert.
# 4. Linktipps, die seit der letzten Linkpflege an das Postfach geschickt wurden, schlägt Claude als neue Einträge vor.

on:
  schedule:
    - cron: "0 5 10 * *" # am 10. jedes Monats gegen 7 Uhr (passt zu STICHTAG in scripts/postfach-abholen.py)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build

      - name: Monat bestimmen
        id: monat
        run: echo "name=$(TZ=Europe/Berlin date +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Liest nur (alle Mails seit der letzten Linkpflege bis gestern) und markiert nichts. Fehler stoppen die Linkprüfung nicht.
      - name: Linktipps aus dem Postfach holen
        id: postfach
        if: vars.POSTFACH_AKTIV == 'true'
        continue-on-error: true
        run: python3 scripts/postfach-abholen.py linktipps
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_BENUTZER: ${{ secrets.IMAP_BENUTZER }}
          IMAP_PASSWORT: ${{ secrets.IMAP_PASSWORT }}
          ERLAUBTE_ABSENDER: ${{ secrets.ERLAUBTE_ABSENDER }}

      - name: Alle externen Links prüfen
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 4 --timeout 30 --max-retries 2
            --scheme https --scheme http
            --accept 200..=299,403,429
            --exclude "linkedin\.com"
            "_site/**/*.html"
          output: eingang/linkpruefung.md
          fail: false

      - name: Claude pflegt den Wissenspool (kaputte Links, Linktipps)
        if: hashFiles('eingang/linkpruefung.md') != '' || hashFiles('eingang/linktipps.md') != ''
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Führe die monatliche Linkpflege für die Website KI for Good durch.
            Halte dich genau an .claude/skills/links-pflegen/SKILL.md und an CLAUDE.md.
            Ergebnis des Linkcheckers: eingang/linkpruefung.md
            Linktipps aus dem Postfach (falls vorhanden): eingang/linktipps.md
            Ändere ausschließlich inhalte/wissenspool.md. Schreibe am Ende IMMER einen Bericht nach eingang/bericht.md –
            auch wenn du nichts geändert hast (dann mit Begründung).
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Edit,Write,WebSearch,WebFetch,Bash(npm run pruefen)"
            --disallowedTools "Bash(git:*)"

      - name: Zusammenfassung des KI-Laufs anzeigen
        if: always()
        run: node scripts/lauf-zusammenfassung.mjs "${{ steps.claude.outputs.execution_file }}"

      - name: Schutzregeln und Daten prüfen
        run: |
          mkdir -p eingang
          test -s eingang/bericht.md || echo "Claude hat keinen Bericht geschrieben. Bitte die Änderungen unter „Files changed“ prüfen." > eingang/bericht.md
          if [ "${{ steps.postfach.outcome }}" = "failure" ]; then
            printf '\n## Postfach\n- ⚠️ Das Postfach konnte nicht gelesen werden. Linktipps aus dem letzten Monat fehlen in diesem Vorschlag. Details unter Actions im Schritt „Linktipps aus dem Postfach holen“.\n' >> eingang/bericht.md
          fi
          node scripts/vorschlag-pruefen.mjs HEAD
          npm run build

      - name: Vorschlag als Pull Request anlegen
        uses: peter-evans/create-pull-request@v7
        with:
          branch: aktualisierung/links-${{ steps.monat.outputs.name }}
          add-paths: inhalte/wissenspool.md
          commit-message: "Wissenspool: Linkpflege ${{ steps.monat.outputs.name }}"
          title: "Linkpflege ${{ steps.monat.outputs.name }} (KI-Vorschlag)"
          body-path: eingang/bericht.md
          labels: ki-vorschlag
          delete-branch: true
